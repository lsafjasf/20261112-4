<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>极地站暴风窗口补给仿真</title>
<style>
  :root { --bg:#0b1622; --panel:#13243a; --line:#27425f; --fg:#dcebf7; --mut:#88a4bd;
          --ok:#57d0a0; --bad:#ff6b6b; --warn:#ffc857; --acc:#6db8ff; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
    font:14px/1.5 "PingFang SC","Microsoft YaHei",sans-serif; }
  header { padding:10px 16px; border-bottom:1px solid var(--line);
    display:flex; gap:14px; align-items:center; flex-wrap:wrap; }
  header h1 { font-size:17px; margin:0; font-weight:600; }
  .stat { display:flex; gap:14px; flex-wrap:wrap; font-variant-numeric:tabular-nums; }
  .stat b { color:var(--acc); font-weight:600; }
  .storm-on { color:var(--bad); font-weight:700; }
  main { display:grid; grid-template-columns: 1fr 330px; gap:12px; padding:12px; }
  @media (max-width: 980px) { main { grid-template-columns: 1fr; } }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:10px; }
  canvas { width:100%; display:block; border-radius:8px; background:#0d1c2c; }
  .controls { display:flex; gap:8px; flex-wrap:wrap; margin:10px 0; }
  button { background:#1d3550; color:var(--fg); border:1px solid var(--line);
    border-radius:8px; padding:7px 12px; cursor:pointer; font-size:13px; }
  button:hover { border-color:var(--acc); }
  button.primary { background:#23507e; border-color:#3a6ea5; }
  button.danger { background:#5a2430; border-color:#8a3a48; }
  button:disabled { opacity:.45; cursor:not-allowed; }
  .scenes { display:flex; gap:8px; flex-wrap:wrap; }
  h2 { font-size:14px; margin:14px 0 6px; color:var(--mut); font-weight:600; }
  .card { border:1px solid var(--line); border-radius:8px; padding:8px 10px; margin:8px 0;
    background:#0f1f31; font-variant-numeric:tabular-nums; }
  .card .name { font-weight:600; margin-bottom:4px; }
  .bar { height:7px; background:#0a1521; border-radius:4px; overflow:hidden; margin:4px 0; }
  .bar > i { display:block; height:100%; background:linear-gradient(90deg,#4a90d9,#7ed3ff); }
  .badge { display:inline-block; padding:1px 7px; border-radius:10px; font-size:12px;
    border:1px solid var(--line); margin-left:6px; }
  .badge.idle { color:var(--mut); } .badge.moving { color:var(--ok); }
  .badge.blocked { color:var(--warn); } .badge.stranded,.badge.lost { color:var(--bad); }
  #log { height:230px; overflow:auto; font-size:12px; background:#0a1521;
    border-radius:8px; padding:8px; font-variant-numeric:tabular-nums; }
  #log .row { margin:2px 0; } #log .t { color:var(--mut); margin-right:6px; }
  #log .failure { color:var(--bad); font-weight:700; }
  #log .deliver { color:var(--ok); } #log .blocked,#log .reroute { color:var(--warn); }
  #fault { font-size:12px; }
  #fault table { width:100%; border-collapse:collapse; }
  #fault td,#fault th { border:1px solid var(--line); padding:4px 6px; text-align:left; }
  .result { font-weight:700; font-size:15px; }
  .result.success { color:var(--ok); } .result.failure { color:var(--bad); }
  label.speed { display:flex; align-items:center; gap:6px; color:var(--mut); }
</style>
</head>
<body>
<header>
  <h1>极地站暴风窗口补给仿真</h1>
  <div class="stat">
    <span>时间 t=<b id="sTime">0</b>/360 min</span>
    <span>温度 <b id="sTemp">--</b>°C</span>
    <span>风速 <b id="sWind">--</b> m/s</span>
    <span id="sStorm">暴风窗口 120–180</span>
    <span id="sResult" class="result"></span>
  </div>
</header>
<main>
  <section class="panel">
    <canvas id="cv" width="900" height="560"></canvas>
    <div class="controls">
      <button id="btnPlay" class="primary">▶ 播放</button>
      <button id="btnPause" disabled>⏸ 暂停</button>
      <button id="btnStep">单步 +1</button>
      <button id="btnReset" class="danger">↺ 重置</button>
      <button id="btnMute">🔊 声音开</button>
      <label class="speed">倍速
        <select id="speed"><option>1</option><option selected>4</option><option>10</option><option>30</option></select>
      </label>
    </div>
    <div class="controls">
      <div class="scenes">
        <button data-scene="success" class="primary">场景1 标准通关</button>
        <button data-scene="miss">场景2 迟发错过窗口（失败）</button>
        <button data-scene="drone">场景3 无人机闯暴风（失败）</button>
      </div>
    </div>
    <div class="controls">
      <button id="btnReroute">⛔ 改道履带车（受阻时可用）</button>
      <span style="color:var(--mut);font-size:12px;align-self:center">
        改道仅替换未走路线，已走路径在画面与日志中保留</span>
    </div>
  </section>
  <aside class="panel">
    <h2>车辆与资源</h2>
    <div id="vehicles"></div>
    <h2>物资批次</h2>
    <div id="batches"></div>
    <h2>故障前后关键状态</h2>
    <div id="fault">尚未触发故障</div>
    <h2>事件日志</h2>
    <div id="log"></div>
  </aside>
</main>
<script src="engine.js"></script>
<script src="app.js"></script>
</body>
</html>
